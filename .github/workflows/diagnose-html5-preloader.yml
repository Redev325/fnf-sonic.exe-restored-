name: Diagnose HTML5 preloader

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal game files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            index.html
            PsychEngine.js
            manifest
            assets
            flixel
            soul-tails.png
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Run browser diagnosis
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage();

            const errors = [];
            const warnings = [];
            const logs = [];
            const failed = [];

            page.on('console', msg => {
              const value = msg.text();
              if (msg.type() === 'error') errors.push(value);
              else if (msg.type() === 'warning') warnings.push(value);
              else if (/asset|load|error|warning|manifest|preload/i.test(value)) logs.push({type: msg.type(), text: value});
            });

            page.on('pageerror', err => errors.push('PAGEERROR: ' + err.message));

            page.on('requestfailed', req => {
              failed.push({
                url: req.url(),
                error: req.failure()?.errorText || 'unknown'
              });
            });

            await page.goto('http://127.0.0.1:8123/', {waitUntil: 'domcontentloaded'});
            await page.waitForTimeout(30000);

            const body = await page.locator('body').innerText().catch(() => '');
            const source = await page.locator('html').evaluate(el => el.outerHTML.slice(0, 2000));
            const canvasInfo = await page.evaluate(() => {
              const canvas = document.querySelector('canvas');
              if (!canvas) return {exists: false};
              let sample = null;
              try {
                const ctx = canvas.getContext('2d', {willReadFrequently: true});
                if (ctx) {
                  const w = canvas.width, h = canvas.height;
                  const ys = [Math.max(0, h - 30), Math.floor(h / 2), Math.min(h - 1, 350)];
                  sample = ys.map(y => {
                    const x = Math.floor(w / 2);
                    return Array.from(ctx.getImageData(Math.max(0, x - 10), y, 20, 1).data);
                  });
                }
              } catch (_) {}
              return {exists: true, width: canvas.width, height: canvas.height, sample};
            });
            const resourceSummary = await page.evaluate(() => performance.getEntriesByType('resource')
              .map(e => ({name: e.name, duration: Math.round(e.duration), size: e.transferSize || 0}))
              .filter(e => e.duration > 1000 || e.size === 0)
              .slice(-100));

            console.log(JSON.stringify({
              url: page.url(),
              title: await page.title(),
              body,
              errors,
              warnings,
              logs,
              failedRequests: failed,
              canvasInfo,
              resourceSummary,
              progressText: progress,
              sourcePreview: source
            }, null, 2));

            await browser.close();

            if (errors.length || failed.length) process.exitCode = 1;
          })();
          NODE
