name: Deploy Sonic.EXE HTML5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify HTML5 build
        run: |
          test -f index.html
          test -f PsychEngine.js
          test -d assets
          test -d flixel
          echo "HTML5 build files are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML5 build
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
