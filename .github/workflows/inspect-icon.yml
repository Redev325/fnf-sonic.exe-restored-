name: Inspect Soul Tails Icon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            PsychEngine.js
            soul-tails.png
            assets/images/icons/icon-soul-tails-custom.png
          sparse-checkout-cone-mode: false
      - name: Inspect compiled asset references
        run: |
          echo "icon-tails references:"
          grep -a -o -m 5 '.\{0,120\}icon-tails.\{0,160\}' PsychEngine.js || true
          echo "soul-tails references:"
          grep -a -o -m 5 '.\{0,120\}soul-tails.\{0,160\}' PsychEngine.js || true
          echo "icon-soul-tails-custom references:"
          grep -a -o -m 5 '.\{0,120\}icon-soul-tails-custom.\{0,160\}' PsychEngine.js || true
