name: Recolor combo numbers blue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recolor:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Apply blue combo number gradient')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Apply blue gradient
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          folder = Path("assets/images")

          TOP = (105, 199, 255)
          MID = (45, 140, 255)
          BOTTOM = (18, 57, 181)

          def lerp(a, b, t):
              return tuple(round(a[i] + (b[i] - a[i]) * t) for i in range(3))

          for path in sorted(folder.glob("num[0-9].png")):
              img = Image.open(path).convert("RGBA")
              px = img.load()
              h = max(1, img.height - 1)

              for y in range(img.height):
                  t = y / h
                  if t < 0.5:
                      rgb = lerp(TOP, MID, t * 2)
                  else:
                      rgb = lerp(MID, BOTTOM, (t - 0.5) * 2)

                  for x in range(img.width):
                      r, g, b, a = px[x, y]
                      if a:
                          # Keep antialiasing/shape exactly as the source sprite.
                          px[x, y] = (*rgb, a)

              img.save(path, optimize=True)

          print("Recolored combo digits:", ", ".join(p.name for p in sorted(folder.glob("num[0-9].png"))))
          PY

      - name: Commit recolored digits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/num[0-9].png
          if git diff --cached --quiet; then
            echo "No image changes detected."
            exit 0
          fi
          git commit -m "Apply blue combo number gradient"
          git push
