name: Fix combo number blue gradient

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Fix combo number blue gradient')"
    steps:
      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Restore originals and update sprites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, io, os, subprocess, requests
          from PIL import Image

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          ORIGINAL = "d067040518f3d7a07ef79208ddf0161d988bd417"
          TOP = (115, 220, 255)
          MID = (45, 145, 255)
          BOTTOM = (20, 65, 190)
          OUTLINE = (9, 20, 70)

          def lerp(a, b, t):
              return tuple(round(a[i] + (b[i] - a[i]) * t) for i in range(3))

          for n in range(10):
              path = f"assets/images/num{n}.png"

              original_url = f"https://raw.githubusercontent.com/{repo}/{ORIGINAL}/{path}"
              raw = requests.get(original_url, timeout=60).content
              if not raw.startswith(b"\x89PNG"):
                  raise RuntimeError(f"Could not download original {path}")

              img = Image.open(io.BytesIO(raw)).convert("RGBA")
              px = img.load()
              h = max(1, img.height - 1)

              for y in range(img.height):
                  t = y / h
                  if t < 0.5:
                      fill = lerp(TOP, MID, t * 2)
                  else:
                      fill = lerp(MID, BOTTOM, (t - 0.5) * 2)

                  for x in range(img.width):
                      r, g, b, a = px[x, y]
                      if not a:
                          continue

                      lum = 0.2126 * r + 0.7152 * g + 0.0722 * b

                      if lum >= 180:
                          nrgb = fill
                      elif lum <= 55:
                          nrgb = OUTLINE
                      else:
                          t2 = (lum - 55) / 125
                          nrgb = tuple(round(OUTLINE[i] * (1 - t2) + fill[i] * t2) for i in range(3))

                      px[x, y] = (*nrgb, a)

              out = io.BytesIO()
              img.save(out, format="PNG", optimize=True)

              get_url = f"https://api.github.com/repos/{repo}/contents/{path}"
              current = requests.get(get_url, headers=headers, timeout=60)
              current.raise_for_status()
              sha = current.json()["sha"]

              payload = {
                  "message": f"Fix combo number blue gradient (num{n})",
                  "content": base64.b64encode(out.getvalue()).decode("ascii"),
                  "sha": sha,
                  "branch": "main"
              }

              put = requests.put(get_url, headers=headers, json=payload, timeout=120)
              put.raise_for_status()

          print("All combo number sprites corrected.")
          PY
